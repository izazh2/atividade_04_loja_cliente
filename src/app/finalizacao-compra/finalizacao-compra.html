
<main class="pagina-finalizacao">

  <h2>Finalizar Compra</h2>

  <section class="bloco">

    <h3>Resumo do pedido</h3>

    @if (itens.length > 0) {

      @for (produto of itens; track $index) {
        <div class="produto-resumo">
          <span>{{ produto.nome }}</span>

          <strong>
            {{ produto.preco | currency:'BRL' }}
          </strong>
        </div>
      }

      <div class="total">
        <span>Total:</span>

        <strong>
          {{ calcularTotal() | currency:'BRL' }}
        </strong>
      </div>

    } @else {

      <p>Seu carrinho está vazio.</p>

    }

    @if (mensagemErro) {
      <p class="mensagem-erro">{{ mensagemErro }}</p>
    }

    <button
      type="button"
      (click)="finalizarCompra()"
      [disabled]="itens.length === 0 || carregando"
    >
      {{ carregando ? 'Registrando pedido...' : 'Confirmar pedido' }}
    </button>

  </section>

</main>
